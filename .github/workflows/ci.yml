name: ci
on: [push, pull_request]

jobs:
  check:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm depcruise
      - run: pnpm build # also emits packages/db/dist, which apps/api imports
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: integration tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-password
          POSTGRES_DB: erp_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_ci" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      DATABASE_ADMIN_URL: postgres://postgres:ci-superuser-password@127.0.0.1:5432/erp_ci
      ERP_APP_PASSWORD: ci-only-app-password
      ERP_SCHEDULER_PASSWORD: ci-only-scheduler-password
      DATABASE_URL: postgres://erp_app:ci-only-app-password@127.0.0.1:5432/erp_ci
      DATABASE_SCHEDULER_URL: postgres://erp_scheduler:ci-only-scheduler-password@127.0.0.1:5432/erp_ci
      TOTP_ENCRYPTION_KEY: Y2ktb25seS10b3RwLWtleS0wMTIzNDU2Nzg5YWJjZGU=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @erp/db --filter @erp/meta build # the API's tests import their built output
      - run: pnpm db:setup # the real migration runner, as the superuser
      - run: pnpm test:integration

  restore-drill:
    name: restore drill (point-in-time recovery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/restore-drill.sh # throwaway clusters; uses the runner's PostgreSQL 16 binaries

  images:
    name: deploy files (compose config, images build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose file is valid
        run: POSTGRES_SUPERUSER_PASSWORD=x ERP_APP_PASSWORD=x ERP_SCHEDULER_PASSWORD=x TOTP_ENCRYPTION_KEY=x docker compose -f deploy/docker-compose.yml config -q
      - name: API image builds, its CLIs and its entry point resolve
        run: |
          docker build -f deploy/Dockerfile.api -t erp-api:ci .
          docker run --rm --entrypoint node erp-api:ci node_modules/@erp/db/dist/migrate/cli.js || test $? -eq 2
          docker run --rm --entrypoint node erp-api:ci -e "import('./dist/create-app.js').then(() => console.log('api entry resolves'))"
      - name: web image builds and serves the sign-in page
        run: |
          docker build -f deploy/Dockerfile.web -t erp-web:ci .
          docker run -d --name web -p 3000:3000 erp-web:ci
          for i in $(seq 1 20); do curl -fs -o /dev/null http://localhost:3000/login && break; sleep 2; done
          curl -fs http://localhost:3000/login | grep -q "Sign in"
      - name: backup image builds
        run: docker build -t erp-backup:ci deploy/backup
