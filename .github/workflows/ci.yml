name: ci
on: [push, pull_request]

jobs:
  check:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm depcruise
      - run: pnpm build # also emits packages/db/dist, which apps/api imports
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: integration tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-password
          POSTGRES_DB: erp_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_ci" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      DATABASE_ADMIN_URL: postgres://postgres:ci-superuser-password@127.0.0.1:5432/erp_ci
      ERP_APP_PASSWORD: ci-only-app-password
      DATABASE_URL: postgres://erp_app:ci-only-app-password@127.0.0.1:5432/erp_ci
      TOTP_ENCRYPTION_KEY: Y2ktb25seS10b3RwLWtleS0wMTIzNDU2Nzg5YWJjZGU=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @erp/db --filter @erp/meta build # the API's tests import their built output
      - run: pnpm db:setup # the real migration runner, as the superuser
      - run: pnpm test:integration

  restore-drill:
    name: restore drill (point-in-time recovery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/restore-drill.sh # throwaway clusters; uses the runner's PostgreSQL 16 binaries
