# Throwaway PostgreSQL for the kernel test suite. Never put app data here: schema.sql creates
# cluster-wide roles and revokes advisory-lock functions from PUBLIC, and every run rebuilds it.
services:
  kernel-test:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: kernel-test-only
    volumes:
      - ./:/kit:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  # The app's dev database: its own container and volume, never the kernel-test one. 0001 creates
  # cluster-wide roles, so this cluster holds only this app's data. Bound to localhost.
  # Setup: cp .env.example .env; docker compose up -d --wait dev-db; pnpm db:setup
  dev-db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-dev-only-superuser-password}
      POSTGRES_DB: erp_dev
    ports:
      - '127.0.0.1:${DEV_DB_PORT:-5432}:5432'
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d erp_dev']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dev-db-data:
